<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="Damon" />
	<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/manifest.json" />
	<title>Damon</title>
	<link rel="stylesheet" href="/app.css" />
	<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
	<script src="/app.js" defer></script>
</head>
<body>
	<div id="app">
		<aside id="sidebar">
			<header class="side-head">
				<div class="brand"><img src="/apple-touch-icon.png" alt="" /><span>Damon</span></div>
				<div class="conn" id="conn" title="Connection"></div>
			</header>
			<div class="filter" role="tablist">
				<button class="chip on" data-filter="all">All</button>
				<button class="chip" data-filter="active">Active</button>
			</div>
			<nav id="tree" aria-label="Rails and agents"></nav>
		</aside>
		<main id="chat" class="empty">
			<header class="chat-head">
				<button class="icon-btn back" id="back" aria-label="Back">
					<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
				</button>
				<img class="avatar sm" id="chat-avatar" alt="" />
				<div class="chat-title">
					<div id="chat-name"></div>
					<div id="chat-sub"></div>
				</div>
				<span class="status-pill" id="chat-status"></span>
			</header>
			<div id="scroller">
				<button id="older" class="older" hidden>Load earlier messages</button>
				<div id="messages"></div>
				<div id="empty-note" class="empty-note"></div>
			</div>
			<div id="dock">
				<div id="action-bar" hidden></div>
				<div id="keys" hidden>
					<button data-key="esc">Esc</button>
					<button data-key="up">↑</button>
					<button data-key="down">↓</button>
					<button data-key="enter">Enter</button>
					<button data-key="1">1</button>
					<button data-key="2">2</button>
					<button data-key="3">3</button>
					<button data-key="shift-tab">⇧Tab</button>
				</div>
				<div id="thumbs" hidden></div>
				<form id="composer" autocomplete="off">
					<button type="button" class="icon-btn keys-toggle" id="keys-toggle" aria-label="Keys">
						<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" /></svg>
					</button>
					<label class="icon-btn" id="attach" aria-label="Attach images">
						<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="10" r="1.6" /><path d="M21 16l-5-5-9 8" /></svg>
						<input type="file" id="file" accept="image/*" multiple hidden />
					</label>
					<textarea id="input" rows="1" placeholder="Reply…" enterkeyhint="send"></textarea>
					<button type="button" class="send stop" id="stop" aria-label="Stop" hidden>
						<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
					</button>
					<button type="submit" class="send" id="send" aria-label="Send" disabled>
						<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
					</button>
				</form>
			</div>
		</main>
	</div>
	<div id="toast" hidden></div>
</body>
</html>
